; ==========================================================================
; Límites de entrada para PHP-FPM / FastCGI (se leen por directorio).
; Nota: expose_php, enable_dl y allow_url_include son PHP_INI_SYSTEM y
; deben configurarse en el php.ini de MAMP, no aquí.
; ==========================================================================
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 10M
max_file_uploads = 10
max_input_vars = 1000
max_input_nesting_level = 32
